# Postgres + API 두 개뿐인 로컬 운영 스택.
#
# API 는 외부 의존성 없이도 뜹니다 — SQLite 한 파일, 프로세스 안의 실시간 허브,
# 로컬 디스크의 첨부 파일. `make dev` 가 그 경로입니다. 이 compose 는 같은
# 코드를 Postgres 위에서 돌려 보는 자리입니다.
#
# Redis · MinIO · S3 · Celery 가 없습니다. 실시간은 프로세스 안의 허브가 처리하고,
# 파일은 UPLOAD_DIR(볼륨)에 저장됩니다.

name: llack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llack
      POSTGRES_PASSWORD: llack
      POSTGRES_DB: llack
      # 한국어 정렬을 initdb 시점에 고정해 두어 DB 를 새로 만들어도 결과가
      # 같게 합니다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llack -d llack"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres 는 컨테이너 안에서만 씁니다 — 안에서 쓰는 드라이버는
      # asyncpg 하나입니다.
      DATABASE_URL: postgresql+asyncpg://llack:llack@postgres:5432/llack
      # 필수: 배포 전에 반드시 덮어쓰세요. 이 값으로 모든 토큰이 서명됩니다.
      #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:-llack-dev-secret-key-change-me-before-production}
      # 첨부 파일은 컨테이너 안에 두지 않고 볼륨으로 받습니다.
      UPLOAD_DIR: /app/var/uploads
      # 데스크톱 앱은 파일:// 오리진으로 접속하므로 기본값(*)을 유지합니다.
      # 좁히려면 배포 주소로 바꿉니다: CORS_ORIGINS=https://llack.example.com
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-1800}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
    # 실시간 허브가 프로세스 안에 있습니다. 워커를 둘 이상 띄우면 서로의
    # 소켓에 이벤트가 전달되지 않으므로 프로세스 하나로 유지합니다.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    ports:
      - "8000:8000"
    volumes:
      # 첨부 파일과 그 밖의 상태 파일이 들어갑니다.
      - api-var:/app/var
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  api-var:
