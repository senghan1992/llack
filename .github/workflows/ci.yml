name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (린트 + 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        working-directory: backend
        run: ruff check app tests scripts

      - name: ruff format
        working-directory: backend
        run: ruff format --check .

      # 모델과 리비전이 어긋났는지 봅니다 — 어긋나면 서버를 띄웠을 때
      # 스키마가 옛 모양으로 남아 사고가 납니다. 여기서 먼저 잡아 둡니다.
      - name: alembic check
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-value-not-used-in-production
          DATABASE_URL: sqlite+aiosqlite:///./var/ci.db
        run: mkdir -p var && alembic upgrade head && alembic check

      - name: pytest
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-value-not-used-in-production
          DATABASE_URL: sqlite+aiosqlite:///./var/ci.db
        run: pytest -q

  frontend:
    name: 프런트엔드 (타입 검사 + 번들)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 의존성 설치
        working-directory: desktop
        run: npm ci

      - name: 타입 검사
        working-directory: desktop
        run: npm run typecheck

      - name: 테스트
        working-directory: desktop
        run: npm run test

      - name: 빌드
        working-directory: desktop
        run: npm run build

  rust:
    name: Rust 셸 (clippy + fmt + 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # src-tauri 는 워크스페이스가 아니라 독립형 cargo 패키지입니다 — 루트에
      # Cargo.toml 이 없고, 캐시 경로도 그쪽을 가리켜야 합니다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # tauri-build 가 frontendDist(../dist) 의 존재를 확인합니다. 셸만 빌드하
      # 는 이 잡에서는 번들이 없으므로, 먼저 프런트엔드 번들을 만들어 둡니다.
      - name: 프런트엔드 번들 준비
        working-directory: desktop
        run: npm ci && npm run build

      - name: clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: rustfmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test

  desktop-shell:
    name: 데스크톱 셸 빌드 (${{ matrix.os }})
    # Tauri 셸은 플랫폼 webview 라이브러리가 필요해서, 배포하는 플랫폼에서
    # 직접 빌드합니다. 리눅스에서만 webview 패키지를 설치합니다.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux webview 의존성
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev \
            libdbus-1-dev build-essential curl wget file patchelf

      # --no-bundle: 이 잡은 셸이 컴파일되는지까지만 봅니다. 설치본은
      # release-windows.yml 이 굽습니다.
      # 이 잡은 "셸이 컴파일되는가" 만 봅니다(결과물을 올리지 않습니다).
      # 서버 주소는 설치본에 심히는 값이라 여기서는 자리표시자로 둡니다 —
      # 실제 배포 주소는 release-windows.yml 이 받습니다.
      - name: 빌드
        working-directory: desktop
        env:
          LLACK_SERVER_URL: https://llack.example.com
        run: |
          npm ci
          npm run app:build -- --no-bundle
