[project]
name = "llack-backend"
version = "0.1.0"
description = "Llack — internal collaboration OS backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "greenlet>=3.1",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "python-multipart>=0.0.17",
  "email-validator>=2.2",
  "httpx>=0.28",
  "aioboto3>=13.2",
  "structlog>=24.4",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
