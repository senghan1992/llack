# Alembic 설정.
#
# 데이터베이스 주소는 여기 적지 않습니다 — `app/core/db.py` 가 환경설정에서
# 읽어 같은 주소로 해석합니다(상대 SQLite 경로의 기준도 같게). 그래서
# 마이그레이션과 서버가 서로 다른 데이터베이스를 가리킬 수 없습니다.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
