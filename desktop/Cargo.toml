# Workspace: `core` is pure Rust (no webview dependency) so the API client,
# offline cache and realtime logic can be built and tested on any machine.
# `src-tauri` is the thin desktop shell that wires those into windows,
# tray, notifications and the mini-app panel host.
[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
tracing = "0.1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
