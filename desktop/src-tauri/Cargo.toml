[package]
name = "llack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Llack — 사내 협업 OS 데스크톱 클라이언트"
default-run = "llack"

[lib]
name = "llack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
llack-core = { path = "../core" }

# `protocol-asset` must be present because `tauri.conf.json` enables
# `app.security.assetProtocol` — tauri-build fails the compile on every
# platform if the allowlist and the Cargo features disagree.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true
base64 = "0.22"
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
url.workspace = true

# Screen capture and input synthesis, compiled in only under the
# `screen-control` feature. Optional so a normal build carries neither the code
# nor these crates, and the three host tools are absent from the catalog.
xcap = { version = "0.0.14", optional = true }
enigo = { version = "0.2", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Off by default: turning it on lets the agent see the screen and drive the
# mouse and keyboard. High-blast-radius, so it is a deliberate build choice.
screen-control = ["dep:xcap", "dep:enigo", "dep:image"]
