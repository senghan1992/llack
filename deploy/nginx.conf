# Llack 웹 모드 프로덕션 서빙.
#
# 한 오리진 원칙: 정적 번들과 API 를 같은 주소에서 냅니다. 그러면 CORS 도,
# 쿠키 도메인도, WebSocket 오리진 검사도 구성할 것이 없습니다 — 개발의
# vite 프록시와 정확히 같은 모양입니다.
#
# TLS 는 이 앞의 로드밸런서/리버스 프록시가 종료하는 구성을 권합니다.
# 이 컨테이너가 직접 종료해야 하면 listen 443 ssl 블록을 여기에 추가하세요.

server {
    listen 80;
    server_name _;

    # 업로드 한도: 백엔드 LLACK_MAX_UPLOAD_BYTES(기본 100MiB)와 맞춥니다.
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 자산은 파일명에 해시가 박혀 있어 영구 캐시가 안전합니다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # WebSocket: /api/v1/ws 는 업그레이드 헤더가 살아서 지나가야 합니다.
    location /api/v1/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 하트비트(25s)보다 넉넉하게: 유휴 소켓이 프록시에서 먼저 죽으면
        # 클라이언트는 이유 없는 재연결 루프를 봅니다.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 파일 스트리밍이 프록시 버퍼에 다 담기지 않아도 되도록.
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # SPA 라우팅: 알 수 없는 경로는 전부 index.html (예: /?invite=…).
    location / {
        try_files $uri /index.html;
    }
}
