# Llack API 리버스 프록시.
#
# 이 설정은 API 만 말합니다. 프런트엔드는 데스크톱 앱(Tauri webview) 안에
# 있고 웹 배포물이 없습니다 — 정적 파일을 serves 할 곳이 없습니다.
#
# 두 가지를 프록시합니다:
#   · /api/        REST (인증, 채널, 메시지, 파일 다운로드)
#   · /api/v1/ws   WebSocket (실시간 이벤트)
#
# TLS 는 이 앞의 로드밸런서/리버스 프록시가 종료하는 구성을 권합니다.
# 이 컨테이너가 직접 종료해야 하면 listen 443 ssl 블록을 여기에 추가하세요.
#
# API 주소는 아래 proxy_pass 에 있습니다. 같은 머신에서 systemd 로 띄운
# API 라면 127.0.0.1:8000 그대로 두고, compose 로 함께 띄운다면 api:8000
# 으로 바꾸세요.

server {
    listen 80;
    server_name _;

    # 업로드 한도: 백엔드 MAX_UPLOAD_BYTES(기본 20MiB)와 맞춥니다.
    client_max_body_size 20m;

    # WebSocket: /api/v1/ws 는 업그레이드 헤더가 살아서 지나가야 합니다.
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 소켓은 오래 살아야 합니다. 프록시가 유휴 소켓을 먼저 끊으면
        # 클라이언트는 이유 없는 재연결 루프를 봅니다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 파일 업로드/다운로드가 버퍼에 다 담기지 않아도 되도록.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
